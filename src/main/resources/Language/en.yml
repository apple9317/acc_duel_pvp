# ================================================================ #
#  ACCDuel Language File: English (en)
#  Auto-extracted to plugins/ACCDuel/Language/ on first run.
#  Switch with language: en in config.yml; apply with /duel reload.
#  Texts use MiniMessage format, placeholders use {xxx}.
# ================================================================ #

prefix: "<gradient:#55d6ff:#6a5cff>[Duel Arena]</gradient> "

only-player: "<red>This command can only be executed by a player.</red>"
no-permission: "<red>You do not have permission to do that.</red>"
help-header: "<gold>===== Duel Arena Help =====</gold>"
help-line: "<gray>/duel {cmd} <dark_gray>- {desc}</dark_gray></gray>"
menu-hint: "<gray>Use <white>/duel</white> to open the type menu, or <white>/duelplayer [player]</white> to invite someone.</gray>"
player-not-found: "<red>Player {player} is not online.</red>"
cannot-self: "<red>You cannot duel yourself.</red>"
target-in-match: "<red>{player} is already in a duel.</red>"
target-in-queue: "<red>{player} is already in the queue.</red>"
target-requests-off: "<red>{player} has disabled duel requests.</red>"
you-in-match: "<red>You are already in a duel.</red>"
you-in-queue: "<red>You are already in the queue.</red>"
request-sent: "<green>Duel request sent to {player} (type: {type}).</green>"
request-received: "<yellow>{player} challenges you to a duel!</yellow> <click:run_command:'/duel accept {player}'><hover:show_text:'Click to accept'><green>[Accept]</green></hover></click> <click:run_command:'/duel deny {player}'><hover:show_text:'Click to decline'><red>[Decline]</red></hover></click>"
request-timeout: "<gray>The duel request from {player} has expired.</gray>"
request-accepted: "<green>Duel request accepted! Entering the arena...</green>"
request-denied: "<gray>You declined the duel request from {player}.</gray>"
no-request: "<red>There is no duel request from that player.</red>"
queue-join: "<green>Joined the {type} queue, please wait...</green>"
queue-leave: "<gray>Left the queue.</gray>"
queue-disabled: "<red>Queue is disabled; invite a player directly.</red>"
queue-found: "<green>Match found! Opponent: {player} (type: {type})</green>"
match-countdown: "<bold><gold>{time}</gold></bold>"
match-fight: "<bold><green>Fight!</green></bold>"
match-round: "<gold>=== Round {round} ===</gold>"
round-winner: "<aqua>Round {round} won by {player} (score {score})</aqua>"
match-win: "<green>You won the duel! Score {score}</green>"
match-lose: "<red>You lost the duel. Score {score}</red>"
match-end-broadcast: "<gold>{winner} defeated {loser} in the arena (score {score})</gold>"
forfeit: "<red>{player} forfeited; {other} wins this round.</red>"
rating-win: "<gray>Rating <green>+{delta}</green> ({from} -> {to})</gray>"
rating-lose: "<gray>Rating <red>{delta}</red> ({from} -> {to})</gray>"
no-arena: "<red>No arena available, please contact an administrator.</red>"
arena-incomplete: "<red>Arena {id} is not fully set up (needs pos1, pos2, spawn red, spawn blue).</red>"
type-not-found: "<red>Duel type {type} not found (create it with /duel arena create [name] [type]).</red>"
no-arena-for-type: "<red>No arena available for type {type}, please contact an administrator.</red>"
no-types: "<red>There are no duel types yet. An admin must create one with /duel arena create [name] [type].</red>"
menu-main-title: "<gradient:#55d6ff:#6a5cff>Duel Arena</gradient>"
menu-invite-title: "<gradient:#55d6ff:#6a5cff>Invite {player} - choose type</gradient>"
spectate-join: "<gray>You are now spectating {player}'s duel.</gray>"
spectate-announce: "<gray>{player} is spectating this duel.</gray>"
spectate-none: "<red>{player} has no ongoing duel.</red>"
commands-blocked: "<red>You cannot use that command during a duel.</red>"
duel-cooldown: "<red>Please wait (cooldown {time}s).</red>"
arena-created: "<green>Arena {id} created (type: {type}), now set the points.</green>"
arena-type-created: "<green>Generated type config <white>{file}</white> (Protection III diamond armor + Sharpness I sword + full inventory of healing potions).</green>"
arena-type-exists: "<gray>A config for type {type} already exists, reusing it.</gray>"
arena-set: "<green>Arena {id} {pos} set to your current position.</green>"
arena-removed: "<green>Arena {id} removed.</green>"
arena-not-found: "<red>Arena {id} does not exist.</red>"
arena-exists: "<red>Arena {id} already exists.</red>"
arena-invalid-name: "<red>Name/type may only contain lowercase letters, numbers, underscores and hyphens.</red>"
arena-invalid-y: "<red>Invalid Y coordinate: {y}</red>"
arena-list: "<gold>Arenas:</gold> <gray>{list}</gray>"
arena-create-usage: "<red>Usage: /duel arena create [name] [type]</red>"
arena-set-usage: "<red>Usage: /duel arena set [arena] [pos1|pos2|miny|spawn red|spawn blue|bed red|bed blue|save] [y]</red>"
arena-set-which: "<red>Multiple arenas, specify: /duel arena set [arena] {pos}</red>"
arena-remove-usage: "<red>Usage: /duel arena remove [arena]</red>"
arena-template-saved: "<green>Saved world template for arena {id} ({count} blocks); it will be restored after matches.</green>"
arena-template-failed: "<red>Failed to save template: arena {id} is missing, pos1/pos2 unset, or world not loaded.</red>"
arena-help:
  - "<gold>===== Arena Setup =====</gold>"
  - "<white>Step 1</white>: Run /duel arena create [name] [type] to create the arena and generate its kit."
  - "<white>Step 2</white>: Stand at one corner and run /duel arena set [name] pos1."
  - "<white>Step 3</white>: Stand at the opposite corner and run /duel arena set [name] pos2."
  - "<white>Step 4</white>: Stand at the red spawn and run /duel arena set [name] spawn red."
  - "<white>Step 5</white>: Stand at the blue spawn and run /duel arena set [name] spawn blue."
  - "<white>Step 6</white>: Run /duel arena set [name] save to store the world template for restore."
  - "<gray>bedfight extra: stand by the bed, red runs /duel arena set [name] bed red, blue runs bed blue.</gray>"
  - "<gray>Optional: run /duel arena set [name] miny [y] to set the void loss line.</gray>"
  - "<white>Finally</white>: Run /duel arena list; a green arena is ready to use."
  - "<gray>With a single arena you can omit the name, e.g. /duel arena set pos1.</gray>"
stats-header: "<gold>===== Duel Stats: {player} =====</gold>"
stats-line: "<gray>{key}: <white>{value}</white></gray>"
top-header: "<gold>===== Duel Leaderboard (by rating) =====</gold>"
top-line: "<gray>#{rank} {player} <white>- {rating}</white> ({wins}W/{losses}L)</gray>"
reloaded: "<green>Configuration reloaded.</green>"
geyser-welcome: "<aqua>We detected you are joining from Bedrock.</aqua> <gray>Night vision compensation has been enabled.</gray>"

bed-set: "<green>The {color} bed point of arena {id} has been set.</green>"
bed-not-found: "<red>No bed found nearby; stand next to a bed and try again.</red>"
bed-broken: "<yellow>{player} broke the {team} bed! {victim} can no longer respawn!</yellow>"
bed-respawn: "<gray>Your bed is safe, respawning in 3 seconds...</gray>"
# Random light-hearted lines after a kill ({winner} / {loser}); keep them friendly, edit freely
kill-taunts:
  - "<gray>{loser} was gently knocked down by {winner}.</gray>"
  - "<gray>{winner} wasn't even warmed up before {loser} lay down.</gray>"
  - "<gray>{loser} decided to lie down for a bit and think about life.</gray>"
  - "<gray>{winner} waved, and {loser} politely sat down.</gray>"
  - "<gray>{loser} got cozy with the ground, thanks to {winner}.</gray>"
  - "<gray>{winner} barely won! {loser} fought well.</gray>"
  - "<gray>{loser} got perfectly arranged by {winner}.</gray>"
  - "<gray>{winner}'s sword had plans, and {loser} approved.</gray>"
  - "<gray>{loser} lost, but did so with remarkable style.</gray>"
  - "<gray>{winner} smiled, and {loser} was already queued to respawn.</gray>"
