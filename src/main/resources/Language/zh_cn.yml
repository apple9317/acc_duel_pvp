arena-create-usage: "<red>用法：/duel arena create 「名称」 「类型」</red>"
arena-set-usage: "<red>用法：/duel arena set 「竞技场」 「pos1|pos2|miny|spawn red|spawn blue|bed red|bed blue|save」 [y]</red>"
