  - "<gray>{loser} 被 {winner} 轻轻推倒了。</gray>"
  - "<gray>{winner} 还没热身，{loser} 已经躺下了。</gray>"
  - "<gray>{loser} 决定在地上躺一会儿，顺便思考人生。</gray>"
  - "<gray>{winner} 招了招手，{loser} 就乖乖坐下了。</gray>"
  - "<gray>{loser} 与大地来了个亲密接触，{winner} 功不可没。</gray>"
  - "<gray>{winner} 险胜！{loser} 虽败犹荣。</gray>"
  - "<gray>{loser} 被 {winner} 安排得明明白白。</gray>"
  - "<gray>{winner} 的剑很有想法，{loser} 表示认可。</gray>"
  - "<gray>{loser} 虽然输了，但姿势相当优雅。</gray>"
  - "<gray>{winner} 微微一笑，{loser} 已在复活点排队。</gray>"
