bed-not-found: "<red>附近没有找到床，请站到床旁再试。</red>"
bed-broken: "<yellow>{player} 挖掉了{team}的床！{victim} 无法再复活了！</yellow>"
bed-respawn: "<gray>你的床还在，3 秒后重生...</gray>"
# 击杀后的随机趣味播报（{winner} 胜者 / {loser} 败者）；风格温和、不冒犯，可自行增删
