# ================================================================ #
#  ACCDuel 语言文件：简体中文（zh_cn）
#  服务端首次运行时自动释放到 plugins/ACCDuel/Language/
#  在 config.yml 用 language: zh_cn / en 切换；修改后 /duel reload 生效。
#  文本使用 MiniMessage 格式，占位符用 {xxx}。
# ================================================================ #

