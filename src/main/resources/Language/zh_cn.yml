arena-help:
  - "<gold>===== 竞技场创建流程 =====</gold>"
  - "<white>第一步</white>：输入 /duel arena create「名称」「类型」，创建竞技场并自动生成装备配置。"
  - "<white>第二步</white>：站到区域一角，输入 /duel arena set「名称」pos1。"
  - "<white>第三步</white>：站到区域另一对角，输入 /duel arena set「名称」pos2。"
  - "<white>第四步</white>：站到红方出生点，输入 /duel arena set「名称」spawn red。"
  - "<white>第五步</white>：站到蓝方出生点，输入 /duel arena set「名称」spawn blue。"
  - "<white>第六步</white>：输入 /duel arena set「名称」save，保存世界模板，赛后自动复原。"
  - "<gray>bedfight 额外一步：站到床旁，红方输入 /duel arena set「名称」bed red，蓝方输入 bed blue。</gray>"
  - "<gray>可选：输入 /duel arena set「名称」miny [y]，设置虚空判负线。</gray>"
  - "<white>最后</white>：输入 /duel arena list，竞技场显示绿色即可使用。"
  - "<gray>只有一个竞技场时可省略名称，例如 /duel arena set pos1。</gray>"
stats-header: "<gold>===== {player} 的决斗数据 =====</gold>"
stats-line: "<gray>{key}：<white>{value}</white></gray>"
top-header: "<gold>===== 决斗排行榜（按积分） =====</gold>"
top-line: "<gray>#{rank} {player} <white>- {rating} 分</white>（{wins}胜/{losses}负）</gray>"
reloaded: "<green>配置已重载。</green>"
geyser-welcome: "<aqua>检测到你使用基岩版进入服务器。</aqua> <gray>竞技决斗场已为你开启夜视补偿。</gray>"

