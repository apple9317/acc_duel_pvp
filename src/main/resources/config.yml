# ============================================================
#  ACCDuel 竞技决斗场 - 主配置
#  支持 Paper 1.21.x - 26.2
#
#  消息与文本使用 MiniMessage 格式：
#    <red>红字</red> <green>绿字</green> <gold>金字</gold>
#    <aqua>青字</aqua> <gray>灰字</gray> <bold>加粗</bold>
#    <gradient:#55d6ff:#6a5cff>渐变</gradient>
#  占位符用 {xxx} 表示，如 {player} {type} {score}
# ============================================================

# 消息前缀
prefix: "<gradient:#55d6ff:#6a5cff>[竞技决斗场]</gradient> "

# 语言（对应 plugins/ACCDuel/Language/ 下的文件名，不含 .yml）：zh_cn 简体中文 / en 英文
# 修改后 /duel reload 生效；Language 文件夹在首次运行时自动生成。
language: zh_cn

# ---------------- 对战规则 ----------------
match:
  # 开局倒计时（秒）
  countdown: 5
  # 每局总回合数（建议奇数：先赢 ceil(rounds/2) 局者胜；1 = 一局定胜负）
  rounds: 3
  # 回合结束到下一回合开始的间隔（秒）
  round-restart-delay: 5
  # 是否取消除对手外的所有伤害（火焰/荆棘/环境等，保证公平 1v1）
  cancel-outside-damage: true
  # 击杀特效：lightning 闪电 / explosion 爆炸 / heart 爱心 / soul 灵魂 / fire 火焰 / death 死亡烟雾 / none 无
  kill-effect: lightning
  # 是否关闭摔落伤害
  fall-damage: false
  # 是否关闭自然回血
  natural-regen: false
  # 是否关闭饥饿度消耗
  hunger: false
  # 进场比赛时的默认生命值（竞技类型可单独覆盖）
  health: 20.0
  # 进场比赛时的默认饥饿值
  food-level: 20
  # 比赛期间禁止丢物品
  no-item-drop: true
  # 比赛期间禁止拾取物品
  no-item-pickup: true
  # 决斗中退出服务器是否判负
  forfeit-on-quit: true
  # 决斗中是否阻止使用其他命令（白名单见 allowed-commands）
  block-commands: true
  # 决斗中允许使用的命令（第一段，不含斜杠）
  allowed-commands: [duel, duelplayer, msg, tell, r, w, reply, whisper, message]

# ---------------- 请求与匹配 ----------------
queue:
  # 是否启用随机匹配（/duel 选择类型加入匹配）
  enabled: true
  # 匹配检查间隔（秒）
  check-interval: 2
# 决斗请求有效期（秒）
request-timeout: 60
# 决斗冷却（秒，0 = 无冷却）
duel-cooldown: 5

# ---------------- 段位积分 ----------------
rating:
  # 是否启用积分系统
  enabled: true
  # 初始积分
  start: 1000
  # K 系数（越大积分变化越快）
  k-factor: 32

# ---------------- 观战 ----------------
spectate:
  enabled: true
  # 观战者进入时是否广播
  announce-join: true

# ---------------- Geyser（基岩版）自动检测 ----------------
# 插件会自动检测 Geyser-Spigot / Geyser 与 floodgate-bukkit，
# 无需在插件配置中手动开关；这里的选项控制检测到后的行为。
geyser:
  # 是否在聊天/榜单中给基岩版玩家加上前缀标记
  tag-bedrock: true
  # 基岩版玩家前缀（MiniMessage 格式）
  bedrock-tag: "<gray>[<aqua>BE</aqua>]</gray> "
  # 比赛期间是否给基岩版玩家自动附加夜视（补偿基岩版渲染差异）
  night-vision-during-match: true
  # 基岩版玩家进入服务器时是否发送欢迎提示
  welcome-message: true

# ---------------- 数据保存 ----------------
stats:
  # 自动保存间隔（分钟）
  autosave-minutes: 10

# ---------------- 语言与消息 ----------------
# 所有消息文本已移至 Language 文件夹（plugins/ACCDuel/Language/），
# 用本文件顶部的 language 选项切换（zh_cn / en），修改后 /duel reload 生效。
# 此处不再保留 messages 配置。
