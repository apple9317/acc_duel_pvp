name: ACCDuel
version: 1.1.0
main: com.apple9317.accduel.ACCDuelPlugin
api-version: '1.21'
authors: [apple9317]
description: 竞技决斗场插件（类似布吉岛决斗场），支持类型化装备配置、Gson 数据存储、Geyser 自动检测与基岩版原生表单
softdepend: [Geyser-Spigot, floodgate-bukkit]

commands:
  duel:
    description: 竞技决斗场主命令（/duel 打开类型选择界面）
    usage: /duel
    aliases: [jj, pvp, 决斗, duelplayer]

permissions:
  accduel.use:
    description: 使用竞技决斗场（打开界面/发起决斗/匹配/观战等）
    default: true
  accduel.admin:
    description: 竞技决斗场管理（竞技场配置、重载）
    default: op
  accduel.spectate:
    description: 观战权限
    default: true
  accduel.kit.*:
    description: 使用全部竞技类型装备配置
    default: true
